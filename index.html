
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="KMD卡米达游戏科技工作室——虚构品牌展示项目">
<meta name="theme-color" content="#050914">
<title>KMD卡米达 | KAMIDA GAME STUDIO</title>

<style>
:root{
 --bg:#050914;
 --panel:#0b1629;
 --blue:#38aaff;
 --light:#a8d9ff;
 --text:#f4f8ff;
 --muted:#9babc1;
 --border:#244365;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
 background:var(--bg);
 color:var(--text);
 font-family:"Microsoft YaHei",Arial,sans-serif;
 line-height:1.7;
 overflow-x:hidden;
}
a{text-decoration:none;color:inherit}

/* 顶部导航 */
header{
 position:fixed;
 top:0;left:0;width:100%;
 height:78px;z-index:1000;
 background:rgba(5,9,20,.9);
 backdrop-filter:blur(18px);
 border-bottom:1px solid #ffffff15;
}
.nav{
 height:100%;
 width:90%;
 max-width:1250px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
 font-size:35px;
 font-weight:1000;
 font-style:italic;
 letter-spacing:-3px;
 color:var(--blue);
 text-shadow:0 0 25px #168cff88;
}
.brand-text strong{display:block;font-size:18px}
.brand-text small{
 display:block;
 color:#8da4c1;
 font-size:9px;
 letter-spacing:2px;
}
.nav-links{display:flex;align-items:center;gap:25px}
.nav-links a{
 color:#c2d1e5;
 font-size:13px;
 transition:.3s;
}
.nav-links a:hover{color:var(--blue)}
.menu-btn{
 display:none;
 background:none;
 color:white;
 border:1px solid #49627e;
 padding:7px 12px;
 cursor:pointer;
}

/* 首页主视觉 */
.hero{
 min-height:760px;
 padding:170px 0 110px;
 display:flex;
 align-items:center;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 76% 35%,#287acb55,transparent 43%),
 radial-gradient(ellipse at 20% 90%,#173e6a55,transparent 48%),
 linear-gradient(120deg,#050914,#0b1930 60%,#050914);
}
.hero:before{
 content:"";
 position:absolute;
 width:600px;height:600px;
 right:-100px;top:100px;
 border:1px solid #54b5ff33;
 border-radius:50%;
 box-shadow:0 0 100px #168cff22,inset 0 0 100px #168cff22;
}
.hero:after{
 content:"";
 position:absolute;
 width:450px;height:450px;
 right:-25px;top:175px;
 border:1px solid #54b5ff22;
 border-radius:50%;
}
.container{
 width:min(1180px,88%);
 margin:auto;
}
.hero-content{position:relative;z-index:2;max-width:680px}
.eyebrow{
 color:var(--blue);
 letter-spacing:6px;
 font-size:12px;
}
.hero h1{
 font-size:clamp(45px,7vw,82px);
 line-height:1.2;
 margin:27px 0;
 letter-spacing:2px;
}
.hero h1 span{
 color:var(--light);
 text-shadow:0 0 35px #168cff66;
}
.hero-desc{
 color:#b6c6dc;
 max-width:540px;
 font-size:15px;
 line-height:2.1;
}
.actions{display:flex;gap:15px;flex-wrap:wrap}
.btn{
 display:inline-block;
 margin-top:32px;
 padding:13px 28px;
 border:1px solid var(--blue);
 background:linear-gradient(110deg,#1262b8,#168fe9);
 color:white;
 font-size:13px;
 letter-spacing:1px;
 transition:.3s;
 cursor:pointer;
}
.btn:hover{
 transform:translateY(-4px);
 box-shadow:0 0 30px #168cff66;
}
.btn-outline{background:transparent;color:var(--light)}
.hero-bottom{
 position:absolute;
 bottom:35px;
 left:6%;
 color:#6683a5;
 font-size:10px;
 letter-spacing:4px;
}
</style>
</head>

<body>

<header>
 <div class="nav">
  <a href=" " class="brand">
   <div class="brand-logo">KMD</div>
   <div class="brand-text">
    <strong>卡米达</strong>
    <small>KAMIDA GAME STUDIO</small>
   </div>
  </a >

  <button class="menu-btn" id="menuBtn">☰</button>

  <nav class="nav-links" id="navLinks">
   <a href="#home">首页</a >
   <a href="#about">关于我们</a >
   <a href="#games">游戏作品</a >
   <a href="#careers">人才招聘</a >
   <a href="#internship">实习计划</a >
   <a href="#contact">联系我们</a >
  </nav>
 </div>
</header>

<main>

<div class="hero" id="home">
 <div class="container">
  <div class="hero-content">
   <div class="eyebrow">KAMIDA DIGITAL ENTERTAINMENT</div>
   <h1>KMD 卡米达<br><span>创造想象 · 探索未来</span></h1>
   <p class="hero-desc">
    以创意为起点，以技术为驱动。
    探索数字娱乐的边界，构建充满想象力的游戏世界。
    让每一次探索都成为新的开始。
   </p >
   <div class="actions">
    <a href="#games" class="btn">探索游戏作品 →</a >
    <a href="#about" class="btn btn-outline">了解 KMD</a >
   </div>
  </div>
 </div>
 <div class="hero-bottom">IMAGINE BEYOND LIMITS · KMD STUDIO</div>
</div>
